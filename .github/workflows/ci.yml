name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · binding-denial
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit + worker integration tests
        run: pnpm run test

      - name: Binding denial inventory (explicit gate)
        run: pnpm exec vitest run tests/unit/contracts-and-bindings.test.ts --project unit

      - name: Homologation gates (fixtures, robots, destination, budgets, imports)
        run: >
          pnpm exec vitest run --project unit
          tests/unit/store-contracts.test.ts
          tests/unit/source-identity.test.ts
          tests/unit/destination-policy.test.ts
          tests/unit/robots-policy.test.ts
          tests/unit/closin-fixtures.test.ts
          tests/unit/closin-budgets.test.ts
          tests/unit/store-binding-and-imports.test.ts
